[alembic]
# Dossier contenant les scripts de migration
script_location = alembic
template = ../alembic_custom_templates

# Ajoute le répertoire courant au sys.path
prepend_sys_path = .

# Format de fichier pour les révisions
# file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Permet d'utiliser plusieurs dossiers de versions si nécessaire
# version_locations = %(here)s/alembic/versions

# Séparateur pour version_locations
version_path_separator = os

# Encodage de sortie des fichiers de migration
output_encoding = utf-8


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
